<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — TRVM</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg:#06080d; --fg:#e8eaf0; --dim:#4a4f66; --sec:#8a8fa8; --cyan:#00d9ff; --pink:#ff3366; --border:#1a1f30; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--fg); font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; line-height:1.7; }
  main { max-width:54ch; }
  .code { font-size:4.5rem; font-weight:700; letter-spacing:-0.03em; color:var(--pink); line-height:1; }
  h1 { font-size:1.05rem; font-weight:400; margin:1rem 0 1.25rem; }
  p { font-size:0.85rem; color:var(--sec); margin-bottom:1.5rem; }
  nav { font-size:0.8rem; border-top:1px solid var(--border); padding-top:1.25rem; }
  a { color:var(--cyan); text-decoration:none; border-bottom:1px solid transparent; }
  a:hover { border-bottom-color:var(--cyan); }
  .sep { color:var(--dim); padding:0 0.6rem; }
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>No such path on trvm.traaviis.com.</h1>
  <p>The page you asked for is not here — and nothing was served in its place.
     An address that does not exist should say so.</p>
  <nav>
    <a href="/">← TRVM</a><span class="sep">·</span><a href="https://computedriven.com">ComputeDriven</a>
  </nav>
</main>
</body>
</html>
